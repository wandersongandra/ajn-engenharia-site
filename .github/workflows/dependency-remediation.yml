name: One-time Deprecated Dependency Cleanup

on:
  push:
    branches: [chore/remove-deprecated-particles-wrapper]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/remove-deprecated-particles-wrapper

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Load dependency graph without lifecycle scripts
        run: npm install --ignore-scripts

      - name: Remove deprecated unused React particles wrapper
        run: npm uninstall react-tsparticles --ignore-scripts

      - name: Apply non-breaking audit fixes
        run: npm audit fix --ignore-scripts

      - name: Validate clean install
        run: |
          rm -rf node_modules
          npm ci

      - name: Validate project
        run: |
          npm run lint
          npm run build
          npm audit --audit-level=high

      - name: Remove one-time workflow and commit dependency cleanup
        run: |
          rm .github/workflows/dependency-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(deps): remove deprecated particles wrapper"
          git push origin HEAD:chore/remove-deprecated-particles-wrapper
